<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santa Isabel — Taller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<meta name="description" content="Control de pedidos y cotizaciones para el Taller Santa Isabel.">
<style>
:root{
  --paper:#FBF7F2; --surface:#FFFFFF; --surface-2:#F6F0E8; --surface-3:#EFE5D6;
  --line:#E7DBC8; --line-2:#D6C4A9;
  --ink:#2A211D; --ink-2:#6E6058; --ink-3:#9C9088;
  --rose:#9C3B4C; --rose-ink:#7A2D3B; --rose-soft:#F2DEE0;
  --gold:#AD8A4E; --gold-soft:#F1E7D3;
  --ok:#5F7A5A;  --ok-soft:#E7EEE4;
  --warn:#AD8A4E; --warn-soft:#F1E7D3;
  --crit:#A24E4A; --crit-soft:#F4E4E3;
  --run:#5C7A93; --run-soft:#E6EDF2;
  --done:#9C9088; --done-soft:#EFEAE2;
  --shadow:0 20px 50px -28px rgba(42,33,29,.30);
  --r:7px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1C1613; --surface:#241D19; --surface-2:#2B231F; --surface-3:#332A24;
    --line:#3B322B; --line-2:#4C4038;
    --ink:#F2E9E1; --ink-2:#C2B3A7; --ink-3:#8B7C71;
    --rose:#E0949F; --rose-ink:#F0B8C0; --rose-soft:#3A2328;
    --gold:#D8B876; --gold-soft:#3A2F1E;
    --ok:#9BB794; --ok-soft:#22281F;
    --warn:#D8B876; --warn-soft:#3A2F1E;
    --crit:#CC7B75; --crit-soft:#2E1F1E;
    --run:#8FAFCB; --run-soft:#1E2730;
    --done:#8A8074; --done-soft:#2A2521;
    --shadow:0 20px 60px -28px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#1C1613; --surface:#241D19; --surface-2:#2B231F; --surface-3:#332A24;
  --line:#3B322B; --line-2:#4C4038;
  --ink:#F2E9E1; --ink-2:#C2B3A7; --ink-3:#8B7C71;
  --rose:#E0949F; --rose-ink:#F0B8C0; --rose-soft:#3A2328;
  --gold:#D8B876; --gold-soft:#3A2F1E;
  --ok:#9BB794; --ok-soft:#22281F;
  --warn:#D8B876; --warn-soft:#3A2F1E;
  --crit:#CC7B75; --crit-soft:#2E1F1E;
  --run:#8FAFCB; --run-soft:#1E2730;
  --done:#8A8074; --done-soft:#2A2521;
  --shadow:0 20px 60px -28px rgba(0,0,0,.7);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;text-wrap:balance}
.disp,h1,.kpi__value,.calhead h2,.brand__name,#drawerTitle,.modal__h h2,.sheet__brand b{
  font-family:Fraunces,Georgia,serif;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
::selection{background:var(--rose);color:#fff}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:20px;border:3px solid var(--paper)}

/* ---------- shell (mobile-first: rail is a desktop-only enhancement) ---------- */
.app{min-height:100vh}
.rail{display:none}
@media (min-width:860px){
  .app{display:grid;grid-template-columns:238px 1fr}
  .rail{
    display:flex;background:var(--surface);color:var(--ink-2);border-right:1px solid var(--line);
    flex-direction:column;gap:4px;padding:0 0 18px;position:sticky;top:0;height:100vh;
  }
}
.brand{padding:24px 20px 20px;margin-bottom:10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.brand__mark{width:26px;height:26px;flex:none;color:var(--rose)}
.brand__name{font-size:19px;font-weight:500;letter-spacing:.002em;color:var(--ink);line-height:1.1}
.brand__sub{font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:1px;padding:8px 12px}
.nav__btn{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:10px 12px;border:0;border-radius:5px;background:transparent;color:var(--ink-2);
  font-size:13.5px;font-weight:400;cursor:pointer;
}
.nav__btn:hover{background:var(--surface-2);color:var(--ink)}
.nav__btn[aria-current="page"]{background:var(--rose-soft);color:var(--rose-ink);font-weight:600}
.nav__ico{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5}
.nav__count{
  margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;
  padding:0 6px;border:1px solid var(--crit);color:var(--crit);border-radius:20px;
}
.rail__foot{
  margin-top:auto;padding:16px 20px 0;font-size:11px;color:var(--ink-3);line-height:1.5;
  border-top:1px solid var(--line);
}
.rail__foot b{color:var(--ink-2);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:9.5px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:14px 15px 12px;flex-wrap:wrap;
}
.topbar h1{font-size:19px;font-weight:500;letter-spacing:-.015em;line-height:1.15}
.topbar__date{font-size:10.5px;color:var(--ink-3);margin-top:5px;letter-spacing:.08em;text-transform:uppercase}
/* en mobile, crear pedido/cotización se hace desde el FAB y los botones propios de cada vista */
.topbar__actions{display:none;margin-left:auto;gap:8px;align-items:center}
.page{padding:16px 15px 96px;display:flex;flex-direction:column;gap:18px;max-width:1280px;width:100%}
@media (min-width:860px){
  .topbar{padding:18px 30px 15px}
  .topbar h1{font-size:22px}
  .topbar__date{font-size:11px;letter-spacing:.09em}
  .topbar__actions{display:flex}
  .page{padding:26px 30px 90px;gap:24px}
}

/* ---------- atoms ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--r);
  border:1px solid var(--line-2);background:transparent;color:var(--ink);
  font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn--primary{background:var(--rose);border-color:var(--rose);color:#fff}
.btn--primary:hover{background:var(--rose-ink);border-color:var(--rose-ink);color:#fff}
.btn--ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn--ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn--sm{padding:6px 11px;font-size:12.5px}
.btn--danger{border-color:var(--crit);color:var(--crit);background:transparent}
.btn--danger:hover{background:var(--crit-soft);border-color:var(--crit)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card__head{display:flex;align-items:baseline;gap:11px;padding:16px 18px 13px;border-bottom:1px solid var(--line)}
.card__head h2{font-size:14.5px;font-weight:600;letter-spacing:.005em}
.card__head .muted{font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.card__body{padding:16px 18px}

/* badges de estado (pedidos) */
.badge{
  display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;line-height:1.7;
}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.s-nuevo{color:var(--ink-3)}
.s-programado{color:var(--run)}
.s-produccion{color:var(--gold)}
.s-terminado{color:var(--ok)}
.s-entregado{color:var(--done)}
.s-atrasado{color:var(--crit);background:var(--crit-soft);padding:2px 8px;border-radius:20px}

/* badges de estado (cotizaciones) */
.qbadge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:20px}
.q-borrador{color:var(--ink-2);background:var(--surface-3)}
.q-enviada{color:var(--run);background:var(--run-soft)}
.q-aprobada{color:var(--ok);background:var(--ok-soft)}
.q-rechazada{color:var(--crit);background:var(--crit-soft)}

.prio{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.prio--alta{color:var(--crit)}

/* banda de indicadores (mobile-first: 2 columnas, se ensancha con el viewport) */
.kpis{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);
}
.kpi:last-child{grid-column:span 2}
.kpi{background:var(--surface);border:0;padding:14px 15px 15px;text-align:left;cursor:pointer;display:flex;flex-direction:column}
.kpi:hover{background:var(--surface-2)}
.kpi__label{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);min-height:2.9em}
.kpi__label::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;background:var(--k,var(--line-2));vertical-align:middle;position:relative;top:-1px}
.kpi__value{font-size:29px;font-weight:500;line-height:1;margin-top:10px;letter-spacing:-.03em}
.kpi__foot{font-size:10px;color:var(--ink-3);margin-top:10px;padding-top:8px;border-top:1px solid var(--line);letter-spacing:.04em}
.kpi--run{--k:var(--gold)} .kpi--week{--k:var(--warn)} .kpi--late{--k:var(--crit)}
.kpi--act{--k:var(--ink-2)} .kpi--fin{--k:var(--ok)}
.kpi--late .kpi__value{color:var(--crit)}
@media (min-width:640px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi:last-child{grid-column:span 1}
  .kpi__value{font-size:34px}
}
@media (min-width:1080px){
  .kpis{grid-template-columns:repeat(5,minmax(0,1fr))}
  .kpi{padding:16px 18px 17px}
  .kpi__label{font-size:10px;letter-spacing:.12em}
  .kpi__value{font-size:37px;margin-top:12px}
  .kpi__foot{font-size:10.5px;margin-top:11px;padding-top:9px;letter-spacing:.05em}
}

/* alertas */
.alerts{display:flex;flex-direction:column}
.alert{
  display:flex;gap:13px;align-items:flex-start;padding:13px 18px;border-bottom:1px solid var(--line);
  border-left:2px solid var(--a,var(--line-2));cursor:pointer;background:none;width:100%;text-align:left;border-top:0;border-right:0;
}
.alert:last-child{border-bottom:0}
.alert:hover{background:var(--surface-2)}
.alert--crit{--a:var(--crit)} .alert--warn{--a:var(--warn)} .alert--info{--a:var(--rose)}
.alert__ico{font-size:11px;color:var(--a);flex:none;width:14px;text-align:center;line-height:1.7}
.alert__txt{font-size:13.5px;line-height:1.5;min-width:0}
.alert__txt b{font-weight:600}
.alert__meta{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;letter-spacing:.02em}
.empty{padding:26px 18px;color:var(--ink-3);font-size:13px;text-align:center;letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;gap:9px}
.empty::before{content:"";width:22px;height:1px;background:var(--line-2)}

/* carga por fecha */
.load{display:flex;gap:5px;align-items:flex-end;overflow-x:auto;padding:6px 0 2px}
.load__d{flex:1 0 36px;border:0;background:none;padding:0;cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.load__bar{width:100%;height:66px;display:flex;align-items:flex-end;border-bottom:1px solid var(--line-2)}
.load__fill{width:100%;background:var(--c,var(--line-2));min-height:2px;border-radius:2px 2px 0 0}
.load__day{font-size:9.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;line-height:1.35}
.load__n{font-size:11px;font-weight:600;color:var(--ink-2);font-family:"IBM Plex Mono",monospace}
.load__d:hover .load__fill{opacity:.75}
.lv-baja{--c:var(--line-2)} .lv-media{--c:var(--gold)} .lv-alta{--c:var(--crit)} .lv-cero{--c:var(--line)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);margin-top:14px;align-items:center;letter-spacing:.05em}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;background:var(--c);display:inline-block;border-radius:2px}

/* listas */
.rows{display:flex;flex-direction:column}
.row{
  display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;
  padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;background:none;
  border-left:0;border-right:0;border-top:0;width:100%;text-align:left;
}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row__main{display:block;min-width:0}
.row__t{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row__s{display:block;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.row__r{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.row__date{display:block;font-size:12px;color:var(--ink-2);font-family:"IBM Plex Mono",monospace}
.row__date--late{color:var(--crit);font-weight:600}
.row__date--soon{color:var(--warn);font-weight:600}

/* esta semana (mobile-first: una columna apilada) */
.week{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
.week .row__t,.week .row__s{white-space:normal}
@media (min-width:640px){ .week{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (min-width:1180px){ .week{grid-template-columns:repeat(4,minmax(0,1fr))} }
.col__h{display:flex;align-items:baseline;gap:9px;padding:14px 16px 11px;border-bottom:1px solid var(--line)}
.col__h h2{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.col__h .muted{font-size:10.5px;color:var(--ink-3);letter-spacing:.05em}
.col__n{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.col--hoy{border-top:2px solid var(--rose)} .col--prox{border-top:2px solid var(--warn)}
.col--late{border-top:2px solid var(--crit)} .col--done{border-top:2px solid var(--ok)}

/* filtros */
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.chips{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:20px;overflow:hidden;width:max-content;max-width:100%}
.chip{padding:7px 14px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--ink-2);font-size:12.5px;cursor:pointer;font-weight:500;letter-spacing:.02em}
.chip:last-child{border-right:0}
.chip:hover{background:var(--surface-2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:10px;font-weight:600;color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase}
.input,select.input,textarea.input{
  padding:9px 11px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);
  font-size:13.5px;width:100%;
}
.input:focus{border-color:var(--rose);outline:none}
textarea.input{resize:vertical;min-height:64px;line-height:1.5}
.input::placeholder{color:var(--ink-3)}
.row2{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){ .row2{grid-template-columns:1fr 1fr} }

/* tabla: en mobile se reemplaza por tarjetas (.cards-m), la tabla real es un progressive enhancement */
.tablewrap{display:none;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:880px}
th{
  font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  text-align:left;font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:transparent;
}
td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.cell-cli{font-weight:500;font-size:14px}
.cell-prod{color:var(--ink-3);font-size:12px;margin-top:1px}
.cell-id{white-space:nowrap;font-size:12px}
.cards-m{display:flex;flex-direction:column}
@media (min-width:860px){
  .tablewrap{display:block}
  .cards-m{display:none}
}

@keyframes flashrow{from{background:var(--rose-soft)}to{background:var(--surface-2)}}
tbody tr.is-new td{background:var(--surface-2);animation:flashrow 2.4s ease-out}
tbody tr.is-new td:first-child{box-shadow:inset 2px 0 0 var(--rose)}
.row.is-new{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--rose);animation:flashrow 2.4s ease-out}

/* calendario (mobile-first: celdas chicas, sin pills; se enriquece en escritorio) */
.calhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:13px 14px;border-bottom:1px solid var(--line)}
.calhead h2{font-size:16px;font-weight:500;text-transform:capitalize;min-width:0;flex:1 1 auto;letter-spacing:-.02em}
.calhead__count{margin-left:0;flex:1 0 100%;text-align:left;font-size:12px;color:var(--ink-3);white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal__dow{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding:8px 0;border-bottom:1px solid var(--line);font-weight:600}
.day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:60px;padding:5px 4px;display:flex;flex-direction:column;gap:3px;background:none;text-align:left;min-width:0;cursor:pointer;font:inherit;color:inherit;border-top:0;border-left:0}
.day:nth-child(7n+7){border-right:0}
.day:hover{background:var(--surface-2)}
.day--out{background:var(--surface-2);color:var(--ink-3);opacity:.5}
.day--today{background:var(--rose-soft)}
.day--out.day--today{opacity:1}
.day__h{display:flex;align-items:center;gap:4px}
.day__n{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500}
.day--today .day__n{color:var(--rose-ink);font-weight:600}
.day__dot{width:11px;height:3px;border-radius:2px;background:var(--c);margin-left:auto}
.day__cnt{display:none;font-size:10px;font-family:"IBM Plex Mono",monospace;color:var(--ink-3)}
.pill{display:none;font-size:10.5px;padding:2px 6px;background:var(--surface-2);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:2px solid var(--line-2);border-radius:2px}
.pill--alta{background:var(--crit-soft);color:var(--crit);border-left-color:var(--crit)}
.day__more{display:none;font-size:10px;color:var(--ink-3);letter-spacing:.05em}
@media (min-width:860px){
  .calhead{flex-wrap:nowrap;gap:11px;padding:15px 18px}
  .calhead h2{font-size:18px;min-width:190px;flex:none}
  .calhead__count{margin-left:auto;flex:none}
  .cal__dow{font-size:9.5px;letter-spacing:.15em;padding:10px 0}
  .day{min-height:112px;padding:8px 9px;gap:5px}
  .day__h{gap:7px}
  .day__n{font-size:12.5px}
  .day__dot{width:18px}
  .day__cnt{display:block}
  .pill,.day__more{display:block}
}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(42,33,29,.4);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim[data-open="true"]{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(450px,100%);background:var(--surface);
  border-left:1px solid var(--line);z-index:70;transform:translateX(102%);transition:transform .24s ease;
  display:flex;flex-direction:column;overflow-y:auto;box-shadow:var(--shadow);
}
.drawer[data-open="true"]{transform:none}
.drawer__h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:18px 20px 15px;display:flex;gap:10px;align-items:flex-start;z-index:2}
#drawerTitle{font-size:19px;font-weight:500;margin-top:5px;letter-spacing:-.02em}
.drawer__b{padding:18px 20px 44px;display:flex;flex-direction:column;gap:22px}
.dl{display:grid;grid-template-columns:118px 1fr;gap:10px 14px;font-size:13.5px}
.dl dt{color:var(--ink-3);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding-top:3px}
.dl dd{margin:0;font-weight:400}
.hist{display:flex;flex-direction:column;gap:0;border-left:1px solid var(--line-2);padding-left:16px;margin-left:3px}
.hist li{list-style:none;padding:0 0 14px;position:relative;font-size:13px}
.hist li::before{content:"";position:absolute;left:-20px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--line-2);border:2px solid var(--surface)}
.hist li:last-child::before{background:var(--rose)}
.hist time{display:block;font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;margin-top:2px}

.modal{
  position:fixed;z-index:70;inset:auto 0 0 0;margin:0 auto;width:min(560px,100%);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;
  transform:translateY(102%);transition:transform .24s ease;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow);
}
@media(min-width:720px){
  .modal{inset:0;height:max-content;max-height:88vh;margin:auto;border-radius:var(--r);transform:translateY(12px);opacity:0;transition:transform .2s,opacity .2s}
  .modal[data-open="true"]{transform:none;opacity:1}
}
.modal[data-open="true"]{transform:none}
.modal__h{padding:20px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal__h h2{font-size:19px;font-weight:500;letter-spacing:-.02em}
.form{padding:16px 18px;display:grid;grid-template-columns:1fr;gap:14px}
.form .full{grid-column:1/-1}
@media (min-width:480px){ .form{padding:18px 20px;grid-template-columns:1fr 1fr;gap:15px} }
.modal__f{padding:0 20px 20px;display:flex;gap:9px;justify-content:flex-end;align-items:center;flex-wrap:wrap}

.notice{border:1px solid var(--line);border-left:2px solid var(--n,var(--line-2));background:var(--nb,var(--surface-2));border-radius:0 var(--r) var(--r) 0;padding:13px 15px;font-size:13px;line-height:1.55}
.notice h3{font-size:10px;font-weight:700;margin-bottom:6px;color:var(--n);letter-spacing:.13em;text-transform:uppercase}
.notice--alta{--n:var(--crit);--nb:var(--crit-soft)}
.notice--media{--n:var(--warn);--nb:var(--warn-soft)}
.notice--baja{--n:var(--ok);--nb:var(--ok-soft)}
.notice ul{margin:8px 0 0;padding-left:18px}
.notice li{margin-bottom:2px}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);
  padding:12px 18px;border-radius:var(--r);font-size:13px;font-weight:500;z-index:90;opacity:0;
  pointer-events:none;transition:.22s;box-shadow:var(--shadow);max-width:92vw;letter-spacing:.01em;
}
.toast[data-open="true"]{opacity:1;transform:translate(-50%,0)}

.validate{font-size:13px;color:var(--ink-2)}
.validate ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:7px;max-width:72ch}
.validate li::marker{color:var(--ink-3);font-weight:600}

.stepper{display:grid;grid-template-columns:repeat(5,1fr);margin:2px 0 18px}
.step{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
.step::before,.step::after{content:"";position:absolute;top:5px;height:1px;background:var(--line-2)}
.step::before{left:0;right:50%} .step::after{left:50%;right:0}
.step:first-child::before,.step:last-child::after{display:none}
.step__dot{width:11px;height:11px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);position:relative;z-index:1}
.step__lab{font-size:8px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3);font-weight:600;line-height:1.3}
@media (min-width:860px){ .step__lab{font-size:8.5px;letter-spacing:.08em} }
.step.is-done .step__dot{background:var(--ink-3);border-color:var(--ink-3)}
.step.is-now .step__dot{background:var(--rose);border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-soft)}
.step.is-now .step__lab{color:var(--rose)}
.stepper--late .step.is-now .step__dot{background:var(--crit);border-color:var(--crit);box-shadow:0 0 0 3px var(--crit-soft)}
.stepper--late .step.is-now .step__lab{color:var(--crit)}

*{transition:background-color .15s ease,color .15s ease,border-color .15s ease,opacity .15s ease}
.page--enter > section,.page--enter > .qeditor,.page--enter > .qsheet-wrap{animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
.page--enter > *:nth-child(2){animation-delay:.05s}
.page--enter > *:nth-child(3){animation-delay:.1s}
.page--enter > *:nth-child(4){animation-delay:.15s}
.page--enter > *:nth-child(5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ================= Cotizaciones ================= */
.qtoolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.qcard:hover{border-color:var(--rose)}
.qcard__top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.qcard__id{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.qcard__cliente{font-family:Fraunces,serif;font-size:17px;font-weight:500;margin-top:2px}
.qcard__prenda{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.qcard__foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.qcard__total{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink)}

.qback{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--ink-2);font-size:13px;cursor:pointer;padding:4px 0}
.qback:hover{color:var(--rose)}

/* editor: una columna en mobile, dos columnas cuando sobra espacio */
.qeditor{display:grid;grid-template-columns:1fr;gap:22px;align-items:start}
.qeditor__form{display:flex;flex-direction:column;gap:20px;min-width:0}
.qsection{display:flex;flex-direction:column;gap:12px}
.qsection__h{display:flex;align-items:baseline;gap:10px}
.qsection__h h3{font-family:Fraunces,serif;font-size:15px;font-weight:500;letter-spacing:-.005em}
.qsection__h .n{font-size:10px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;letter-spacing:.08em}
.qstitch{border:0;border-top:1.5px dashed var(--line-2);margin:0}
@media (min-width:1180px){
  .qeditor{grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:26px}
  .qeditor__form{gap:22px}
  .qsection__h h3{font-size:15.5px}
}

.dropzone{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:14px;display:flex;gap:14px;align-items:center;background:var(--surface-2);cursor:pointer}
.dropzone:hover{border-color:var(--rose)}
.dropzone img{width:52px;height:52px;object-fit:cover;border-radius:5px;flex:none;background:var(--surface-3)}
.dropzone__ph{width:52px;height:52px;border-radius:5px;flex:none;background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.dropzone__txt{font-size:12px;color:var(--ink-2)}
.dropzone__txt b{color:var(--ink);font-weight:600;display:block;font-size:12.5px;margin-bottom:2px}

.minitable{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mrow{display:grid;grid-template-columns:1fr 54px 54px 24px;gap:5px;padding:7px 9px;align-items:center;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow input{padding:6px 6px;font-size:12px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);width:100%}
.mrow--head{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:7px 9px 4px}
@media (min-width:480px){
  .mrow{grid-template-columns:1fr 70px 70px 26px;gap:8px;padding:7px 12px}
  .mrow input{padding:6px 8px;font-size:12.5px}
  .mrow--head{font-size:9px;letter-spacing:.1em;padding:7px 12px 4px}
}

.lgroup{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.lgroup__h{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:12px;font-weight:600;letter-spacing:.03em}
.lgroup__h .tot{margin-left:auto;font-family:"IBM Plex Mono",monospace;color:var(--ink-2)}
.lrow{display:grid;grid-template-columns:1fr 44px 58px 58px 22px;gap:5px;padding:8px 9px;align-items:center;border-bottom:1px solid var(--line)}
.lrow:last-of-type{border-bottom:0}
.lrow input{padding:6px 5px;font-size:11.5px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);width:100%}
.lrow .sub{font-size:11px;text-align:right;color:var(--ink-2);font-family:"IBM Plex Mono",monospace}
.lrow--head{padding:6px 9px 4px;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border-bottom:0}
.laddrow{padding:8px 9px}
@media (min-width:480px){
  .lgroup__h{padding:10px 13px}
  .lrow{grid-template-columns:1fr 64px 76px 76px 26px;gap:8px;padding:8px 13px}
  .lrow input{padding:6px 8px;font-size:12.5px}
  .lrow .sub{font-size:12px}
  .lrow--head{padding:6px 13px 4px;font-size:9px;letter-spacing:.1em}
  .laddrow{padding:8px 13px}
}
.rowdel{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:15px;line-height:1;padding:4px}
.rowdel:hover{color:var(--crit)}
.addline{background:none;border:1px dashed var(--line-2);border-radius:4px;color:var(--ink-2);font-size:12px;font-weight:500;padding:6px 10px;cursor:pointer;width:100%;text-align:left}
.addline:hover{border-color:var(--rose);color:var(--rose)}
.qterms textarea{min-height:100px;font-size:12px;line-height:1.6}

/* la hoja de cotización (mobile-first: ocupa todo el ancho, sin sticky) */
.qsheet-wrap{display:flex;justify-content:center;min-width:0}
.sheet{
  width:100%;max-width:640px;background:var(--surface);border:1px solid var(--line);border-radius:8px;
  box-shadow:var(--shadow);padding:22px 18px;display:flex;flex-direction:column;gap:20px;position:static;
}
.sheet--static{position:static}
.sheet__head{display:flex;flex-direction:column;gap:10px}
.sheet__brand{display:flex;flex-direction:column;gap:3px}
.sheet__brand b{font-size:21px;font-weight:500;letter-spacing:-.01em}
.sheet__brand span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.sheet__doc{text-align:left;font-size:11.5px;color:var(--ink-2)}
.sheet__doc .id{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--rose);font-weight:600}
.sheet__doc .valid{margin-top:6px;display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:2px 9px}
.sheet__stitch{border:0;border-top:1.5px dashed var(--line-2);margin:0}
.sheet__client{display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:12.5px}
.sheet__client dt{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.sheet__client dd{margin:0;font-weight:500}
.sheet__hero{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.sheet__img{width:96px;height:122px;border-radius:6px;object-fit:cover;flex:none;background:var(--surface-2);border:1px solid var(--line)}
.sheet__img--ph{display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:11px;text-align:center;padding:8px}
.sheet__desc{min-width:180px;flex:1 1 180px}
.sheet__desc h3{font-family:Fraunces,serif;font-style:italic;font-size:16px;font-weight:500;margin-bottom:6px;color:var(--ink)}
.sheet__desc p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.sheet h4.lbl{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--rose);margin:0 0 8px}
table.sheet-t{border-collapse:collapse;width:100%;font-size:11.5px}
table.sheet-t th{text-align:left;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:6px 5px;border-bottom:1px solid var(--line-2);font-weight:600}
table.sheet-t td{padding:6px 5px;border-bottom:1px solid var(--line);vertical-align:middle}
table.sheet-t tr:last-child td{border-bottom:0}
table.sheet-t td.r,table.sheet-t th.r{text-align:right;font-family:"IBM Plex Mono",monospace}
.grp-tot td{font-weight:600;border-top:1px solid var(--line-2);background:var(--surface-2)}
.curvas{display:grid;grid-template-columns:1fr;gap:14px}
.curvas table.sheet-t td,.curvas table.sheet-t th{padding:5px 5px;font-size:11px}
.totalbox{display:flex;flex-direction:column;gap:0;border:1.5px solid var(--rose);border-radius:6px;overflow:hidden}
.totalbox__row{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;font-size:12px;border-bottom:1px solid var(--rose-soft)}
.totalbox__row:last-child{border-bottom:0}
.totalbox__row.grand{background:var(--rose-soft);font-weight:700;font-size:14px;padding:12px}
.totalbox__row.grand .amt{font-family:"IBM Plex Mono",monospace;color:var(--rose-ink)}
.totalbox__row .amt{font-family:"IBM Plex Mono",monospace;font-weight:600}
.sheet__terms{font-size:10.5px;color:var(--ink-3);line-height:1.65;white-space:pre-line}
.sheet__foot{display:flex;flex-direction:column;gap:6px;font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
.sheet__foot .signature{border-top:1px solid var(--line-2);padding-top:6px;width:150px;text-align:center;align-self:flex-end}
.sheet__actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:2px}
@media (min-width:560px){
  .sheet{padding:32px 32px 28px;gap:22px}
  .sheet__head{flex-direction:row;justify-content:space-between;gap:20px;align-items:flex-start}
  .sheet__doc{text-align:right}
  .sheet__brand b{font-size:23px}
  .sheet__img{width:112px;height:142px}
  table.sheet-t{font-size:12px}
  table.sheet-t th{font-size:9.5px;letter-spacing:.08em;padding:6px 8px}
  table.sheet-t td{padding:6px 8px}
  .curvas{grid-template-columns:1fr 1fr;gap:18px}
  .curvas table.sheet-t td,.curvas table.sheet-t th{padding:5px 7px;font-size:11.5px}
  .totalbox__row{padding:8px 14px;font-size:12.5px}
  .totalbox__row.grand{font-size:15px;padding:12px 14px}
  .sheet__foot{flex-direction:row;justify-content:space-between;align-items:center}
  .sheet__foot .signature{align-self:auto}
}
@media (min-width:1180px){ .sheet{padding:38px 38px 32px;position:sticky;top:96px} }

.exportNotice{display:none;align-items:flex-start;gap:12px;padding:12px 18px;background:var(--gold-soft);border:1px solid var(--line);border-radius:var(--r);font-size:12.5px;color:var(--ink-2);line-height:1.6}
.exportNotice.is-open{display:flex}
.exportNotice b{color:var(--ink)}
.exportNotice kbd{font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--surface);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px;color:var(--ink)}
.exportNotice__close{margin-left:auto;background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;flex:none}
.exportNotice__close:hover{color:var(--ink)}

/* ---------- navegación móvil: barra inferior + fab, por defecto visibles ---------- */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:4px 2px;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;font-weight:500}
.tabbar button[aria-current="page"]{color:var(--rose)}
.tabbar .nav__ico{width:19px;height:19px}
.fab{display:flex;position:fixed;right:18px;bottom:78px;z-index:55;width:52px;height:52px;border-radius:50%;align-items:center;justify-content:center;background:var(--rose);color:#fff;border:0;font-size:24px;box-shadow:var(--shadow);cursor:pointer;line-height:1}
@media (min-width:860px){ .tabbar{display:none} .fab{display:none} }

@media print{
  @page{ size:A4; margin:14mm 13mm; }
  html,body{background:#fff}
  .rail,.topbar,.tabbar,.fab,.qeditor__form,.exportNotice,.qback,.sheet__actions{display:none!important}
  .page{padding:0} .qsheet-wrap{padding:0}
  .sheet{box-shadow:none;border:0;position:static;max-width:100%;padding:0;gap:16px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact}
  .sheet__hero,.totalbox,.sheet__foot,table.sheet-t{break-inside:avoid}
  #q-groups{display:flex;flex-direction:column;gap:12px}
  #q-groups > div{break-inside:avoid}
  h4.lbl,.sheet__client,.sheet__head{break-after:avoid}
  .sheet__terms{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <path d="M4 12c3-6 13-6 16 0-3 6-13 6-16 0Z"/><circle cx="12" cy="12" r="2.1" fill="currentColor" stroke="none"/>
        <path d="M12 4.2v1.6M12 18.2v1.6" stroke-dasharray="1.6 1.8"/>
      </svg>
      <div><div class="brand__name">Santa Isabel</div><div class="brand__sub">Taller de confección</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail__foot"><b>Prototipo de validación</b><br>Datos ficticios. Los cambios no se guardan al recargar.</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div><h1 id="viewTitle">Tablero</h1><div class="topbar__date" id="todayLabel"></div></div>
      <div class="topbar__actions">
        <button class="btn btn--ghost btn--sm" id="btnNewQuote">+ Cotización</button>
        <button class="btn btn--primary" id="btnNew">+ Nuevo pedido</button>
      </div>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>

<nav class="tabbar" id="tabbar"></nav>
<button class="fab" id="fab" aria-label="Nuevo pedido">+</button>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" tabindex="-1">
  <div class="drawer__h">
    <div style="min-width:0"><div class="eyebrow" id="drawerKicker">Pedido</div><h2 id="drawerTitle"></h2></div>
    <button class="btn btn--ghost btn--sm" id="drawerClose" style="margin-left:auto" aria-label="Cerrar">Cerrar</button>
  </div>
  <div class="drawer__b" id="drawerBody"></div>
</aside>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal__h"><h2 id="modalTitle">Nuevo pedido</h2><button class="btn btn--ghost btn--sm" id="modalClose" style="margin-left:auto" aria-label="Cerrar">Cerrar</button></div>
  <form class="form" id="form" novalidate>
    <div class="field full"><label for="f-cliente">Cliente</label><input class="input" id="f-cliente" list="clientes" placeholder="Nombre de la clienta" required><datalist id="clientes"></datalist></div>
    <div class="field full"><label for="f-producto">Prenda</label><input class="input" id="f-producto" list="productos" placeholder="Ej. Vestido de quinceañera" required><datalist id="productos"></datalist></div>
    <div class="field"><label for="f-cantidad">Cantidad</label><input class="input num" id="f-cantidad" type="number" min="1" step="1" value="1" required></div>
    <div class="field"><label for="f-prioridad">Prioridad</label><select class="input" id="f-prioridad"><option>Normal</option><option>Alta</option><option>Baja</option></select></div>

  seq += 1;

    const hasta = ESTADOS.indexOf(p.estado);
    const ini = parse(p.registro);
    const fin = parse(p.compromiso) < hoy() ? parse(p.compromiso) : hoy();

}

  page.innerHTML = ({ tablero:vTablero, semana:vSemana, pedidos:vPedidos, cotizaciones:vCotizaciones, calendario:vCalendario })[state.view]();
  wire();

    state.cotiz.wired = true;
    if(state.cotiz.modo === "ver") wireVerCotizacion();

  }
  if(state.entrando){
    state.entrando = false;
    page.classList.remove("page--enter"); void page.offsetWidth; page.classList.add("page--enter");
    animarCifras();
  }
}
function animarCifras(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if(document.hidden) return;
  page.querySelectorAll(".kpi__value").forEach(el => {
    const fin = Number(el.textContent);
    if(!isFinite(fin) || fin < 2) return;
    const t0 = performance.now(), dur = 460;
    const seguro = setTimeout(() => { el.textContent = fin; }, 900);
    requestAnimationFrame(function paso(t){
      const k = Math.min(1, (t - t0) / dur);
      el.textContent = Math.round(fin * (1 - Math.pow(1 - k, 3)));
      if(k < 1) requestAnimationFrame(paso); else { el.textContent = fin; clearTimeout(seguro); }
    });
  });
}

function alertas(){
  const out = [];
  const late = pedidos.filter(atrasado).sort((a,b) => a.compromiso.localeCompare(b.compromiso));
  late.forEach(p => out.push(alerta("crit","!", "<b>"+esc(p.cliente)+"</b> · "+esc(p.producto)+" está atrasado",
    "Comprometido "+fechaCorta(p.compromiso)+" · "+relativo(p.compromiso)+" · "+p.estado, p.id)));

  pedidos.filter(p => ["Nuevo","Programado"].includes(p.estado) && !atrasado(p))
    .filter(p => diasDesdeHoy(p.compromiso) <= 3).sort((a,b) => a.compromiso.localeCompare(b.compromiso)).slice(0,4)
    .forEach(p => out.push(alerta("warn","!","<b>"+esc(p.cliente)+"</b> vence "+relativo(p.compromiso)+" y aún no entra a producción",
      esc(p.producto)+" · "+nf(p.cantidad)+" und · "+fechaCorta(p.compromiso), p.id)));

  let altas = 0;
  for(let i=0;i<21 && altas<3;i++){
    const f = isoOff(i), c = cargaDe(f);
    if(c.nivel === "alta"){ altas += 1;
      out.push(alerta("warn","▲","<b>"+fechaLarga(f)+"</b> tiene carga alta", c.n+" pedidos comprometidos para esa fecha", null, f));
    }
  }
  const hoyEnt = pedidos.filter(p => activo(p) && diasDesdeHoy(p.compromiso) === 0);
  if(hoyEnt.length) out.unshift(alerta("info","●","<b>"+hoyEnt.length+" entrega"+(hoyEnt.length>1?"s":"")+" comprometida"+(hoyEnt.length>1?"s":"")+" para hoy</b>",
    hoyEnt.map(p => p.cliente).join(" · "), null, isoOff(0)));

  const vencenQ = cotizaciones.filter(q => q.estado==="Enviada" && diasDesdeHoy(iso(addDays(parse(q.fecha), q.vigencia))) <= 3 && diasDesdeHoy(iso(addDays(parse(q.fecha), q.vigencia))) >= 0);
  vencenQ.forEach(q => out.push(alerta("warn","◆","<b>"+esc(q.cliente)+"</b> · cotización "+q.id+" vence pronto",
    "Vigencia hasta "+fechaCorta(iso(addDays(parse(q.fecha), q.vigencia))), null)));

  return out.length ? out.join("") : '<div class="empty">Sin alertas. Todo el taller está al día.</div>';
}

    '<span class="alert__ico">'+ico+'</span><span class="alert__txt">'+txt+'<span class="alert__meta">'+meta+"</span></span></button>";

/* ---- Pedidos ---- */
function filtrar(){
  const f = state.filtros, t = f.texto.trim().toLowerCase();
  return pedidos.filter(p => {
    if(f.estado !== "Todos" && estadoVis(p) !== f.estado) return false;
    if(f.cliente !== "Todos" && p.cliente !== f.cliente) return false;
    const n = diasDesdeHoy(p.compromiso);
    if(f.rango === "Hoy" && n !== 0) return false;
    if(f.rango === "Esta semana" && !(n >= 0 && n <= 6)) return false;
    if(f.rango === "15 días" && !(n >= 0 && n <= 15)) return false;
    if(f.rango === "Vencidas" && n >= 0) return false;
    if(t && !(p.cliente+" "+p.producto+" "+p.id+" "+p.responsable).toLowerCase().includes(t)) return false;
    return true;
  }).sort((a,b) => {
    if(a.id === state.recien) return -1; if(b.id === state.recien) return 1;
    const d = ORDEN_ESTADO[estadoVis(a)] - ORDEN_ESTADO[estadoVis(b)];
    if(d !== 0) return d;
    return a.estado === "Entregado" ? b.compromiso.localeCompare(a.compromiso) : a.compromiso.localeCompare(b.compromiso);
  });
}

/* ---- Calendario ---- */
function vCalendario(){
  const m = state.mes, y = m.getFullYear(), mo = m.getMonth();
  const primero = new Date(y,mo,1);
  const offset = (primero.getDay()+6)%7;
  const inicio = addDays(primero,-offset);
  const celdas = [];
  for(let i=0;i<42;i++){
    const d = addDays(inicio,i), f = iso(d), c = cargaDe(f);
    const ps = pedidosDe(f);
    celdas.push(
      '<button class="day'+(d.getMonth()!==mo?" day--out":"")+(f===iso(hoy())?" day--today":"")+'" data-day="'+f+'">'+
        '<span class="day__h"><span class="day__n">'+d.getDate()+"</span>"+
          (c.n ? '<span class="day__cnt num">'+c.n+"</span><span class=\"day__dot lv-"+c.nivel+'"></span>' : "")+
        "</span>"+
        ps.slice(0,3).map(p => '<span class="pill'+(c.nivel==="alta"?" pill--alta":"")+'">'+esc(p.cliente)+" · "+nf(p.cantidad)+"</span>").join("")+
        (ps.length > 3 ? '<span class="day__more">+'+(ps.length-3)+" más</span>" : "")+
      "</button>");
  }
  const mesesTot = pedidos.filter(p => activo(p) && p.compromiso.startsWith(y+"-"+String(mo+1).padStart(2,"0"))).length;

  return '<section class="card">'+
    '<div class="calhead">'+
      '<button class="btn btn--sm" data-mes="-1" aria-label="Mes anterior">←</button>'+
      "<h2>"+MESES[mo]+" "+y+"</h2>"+
      '<button class="btn btn--sm" data-mes="1" aria-label="Mes siguiente">→</button>'+
      '<button class="btn btn--sm btn--ghost" data-mes="0">Hoy</button>'+
      '<span class="calhead__count muted"><b class="num">'+mesesTot+"</b> entregas este mes</span>"+
    "</div>"+
    '<div class="cal">'+DOW.map(d => '<div class="cal__dow">'+d+"</div>").join("")+celdas.join("")+"</div>"+
    '<div class="card__body legend" style="border-top:1px solid var(--line)">'+
      '<span><i style="--c:var(--line-2)"></i>Carga baja</span>'+
      '<span><i style="--c:var(--gold)"></i>Carga media</span>'+
      '<span><i style="--c:var(--crit)"></i>Carga alta</span>'+
      '<span class="muted">Toca un día para ver sus pedidos</span>'+
    "</div>"+
  "</section>";
}

  const puedeAprobar = q.estado !== "Aprobada" && q.estado !== "Rechazada";
  return '<div style="display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto;width:100%">'+

    '<div class="sheet__actions">'+
      (puedeAprobar ? '<button class="btn btn--primary btn--sm" id="btnAprobarQ">Aprobar y crear pedido</button>'+
        '<button class="btn btn--ghost btn--sm" id="btnMarcarEnviada" '+(q.estado==="Enviada"?"disabled":"")+'>Marcar como enviada</button>'+
        '<button class="btn btn--ghost btn--sm" id="btnRechazarQ">Rechazar</button>' : "")+
      (q.pedidoId ? '<button class="btn btn--ghost btn--sm" data-open="'+q.pedidoId+'">Ver pedido '+q.pedidoId+"</button>" : "")+

    "</div>"+

function wireVerCotizacion(){
  const q = cotizaciones.find(x => x.id === state.cotiz.verId);
  if(!q) return;
  const back = page.querySelector('[data-back="cotizaciones"]'); if(back) back.onclick = () => { state.cotiz.modo="lista"; render(); };
  const edit = $("#btnEditarQ"); if(edit) edit.onclick = () => abrirCotiz("editar", q.id);
  const aprobar = $("#btnAprobarQ"); if(aprobar) aprobar.onclick = () => aprobarCotizacion(q);
  const enviar = $("#btnMarcarEnviada"); if(enviar) enviar.onclick = () => { q.estado = "Enviada"; toast(q.id+" marcada como enviada"); render(); };
  const rechazar = $("#btnRechazarQ"); if(rechazar) rechazar.onclick = () => { q.estado = "Rechazada"; toast(q.id+" marcada como rechazada"); render(); };
  const abrirPed = page.querySelector('[data-open="'+q.pedidoId+'"]'); if(abrirPed) abrirPed.onclick = () => { go("pedidos"); setTimeout(()=>abrirPedido(q.pedidoId),60); };
  wireExport($("#theSheet"), q, "#btnPrintQ");
}

function aprobarCotizacion(q){
  q.estado = "Aprobada";
  const compromiso = isoOff(42);
  const p = crear({
    cliente:q.cliente, producto:q.prenda, cantidad:qUnidades(q) || 1,
    compromiso, solicitada:compromiso, registro:iso(hoy()),
    estado:"Nuevo", prioridad:"Normal", responsable:"", obs:"Generado desde cotización "+q.id
  });
  pedidos.push(p);
  q.pedidoId = p.id;
  state.recien = p.id;
  toast(q.id+" aprobada · pedido "+p.id+" creado");
  go("pedidos");
  setTimeout(()=>abrirPedido(p.id), 80);
}

function initEditorCotiz(){
  const d = state.cotiz.draft;
  const qs = s => page.querySelector(s);

  qs("#q-cliente").value = d.cliente; qs("#q-id").value = d.id; qs("#q-vigencia").value = d.vigencia;
  qs("#q-prenda").value = d.prenda; qs("#q-obs").value = d.obs;
  qs("#q-muestra").value = d.muestra; qs("#q-molde").value = d.molde;
  qs("#q-termsProd").value = d.termsProd; qs("#q-termsMuestra").value = d.termsMuestra;
  if(d.img){ qs("#q-imgPreview").src = d.img; qs("#q-imgPreview").style.display="block"; qs("#q-imgPh").style.display="none"; }

  function updateSheet(){ qs("#q-sheet").innerHTML = sheetHTML(d); }

  function renderCurva(){
    const box = qs("#q-curvaTable");
    box.querySelectorAll(".mrow:not(.mrow--head)").forEach(r=>r.remove());
    d.curva.forEach((r,i)=>{
      const el = document.createElement("div"); el.className = "mrow";
      el.innerHTML = '<input data-f="talla" value="'+esc(r.talla)+'">'+
        '<input data-f="consumo" class="num" type="number" step="0.01" value="'+r.consumo+'">'+
        '<input data-f="cant" class="num" type="number" step="1" value="'+r.cant+'">'+
        '<button class="rowdel" aria-label="Quitar">×</button>';
      box.appendChild(el);
      el.querySelectorAll("input").forEach(inp => inp.oninput = () => { r[inp.dataset.f] = inp.dataset.f==="talla"?inp.value:Number(inp.value); updateSheet(); });
      el.querySelector(".rowdel").onclick = () => { d.curva.splice(i,1); renderCurva(); updateSheet(); };
    });
  }
  function renderColores(){
    const box = qs("#q-colorTable");
    box.querySelectorAll(".mrow:not(.mrow--head)").forEach(r=>r.remove());
    d.colores.forEach((r,i)=>{
      const el = document.createElement("div"); el.className = "mrow"; el.style.gridTemplateColumns = "1fr 90px 26px";
      el.innerHTML = '<input data-f="color" value="'+esc(r.color)+'"><input data-f="cant" class="num" type="number" step="1" value="'+r.cant+'"><button class="rowdel" aria-label="Quitar">×</button>';
      box.appendChild(el);
      el.querySelectorAll("input").forEach(inp => inp.oninput = () => { r[inp.dataset.f] = inp.dataset.f==="color"?inp.value:Number(inp.value); updateSheet(); });
      el.querySelector(".rowdel").onclick = () => { d.colores.splice(i,1); renderColores(); updateSheet(); };
    });
  }
  function renderGroups(){
    const host = qs("#q-groups"); host.innerHTML = "";
    d.groups.forEach((g,gi)=>{
      const wrap = document.createElement("div"); wrap.className = "lgroup";
      wrap.innerHTML = '<div class="lgroup__h">'+esc(g.label)+'<span class="tot">'+money(groupTotal(g))+'</span></div>'+
        '<div class="lrow lrow--head"><span>Nombre</span><span>Cons.</span><span>Precio</span><span>Total</span><span></span></div>'+
        '<div class="rows"></div><div class="laddrow"><button class="addline addRow">+ Agregar ítem</button></div>';
      const rows = wrap.querySelector(".rows");
      g.rows.forEach((r,ri)=>{
        const el = document.createElement("div"); el.className = "lrow";
        el.innerHTML = '<input data-f="n" value="'+esc(r.n)+'"><input data-f="c" class="num" type="number" step="0.01" value="'+r.c+'">'+
          '<input data-f="p" class="num" type="number" step="0.01" value="'+r.p+'"><span class="sub">'+money(r.c*r.p)+'</span><button class="rowdel" aria-label="Quitar">×</button>';
        rows.appendChild(el);
        el.querySelectorAll("input").forEach(inp => inp.oninput = () => {
          r[inp.dataset.f] = inp.dataset.f==="n" ? inp.value : Number(inp.value);
          el.querySelector(".sub").textContent = money(r.c*r.p);
          wrap.querySelector(".tot").textContent = money(groupTotal(g));
          updateSheet();
        });
        el.querySelector(".rowdel").onclick = () => { g.rows.splice(ri,1); renderGroups(); updateSheet(); };
      });
      wrap.querySelector(".addRow").onclick = () => { g.rows.push({n:"Nuevo ítem",c:1,p:0}); renderGroups(); updateSheet(); };
      host.appendChild(wrap);
    });
  }

  ["cliente","id","prenda","obs"].forEach(f => qs("#q-"+f).addEventListener("input", () => { d[f] = qs("#q-"+f).value; updateSheet(); }));
  qs("#q-vigencia").addEventListener("input", () => { d.vigencia = Number(qs("#q-vigencia").value)||0; updateSheet(); });
  qs("#q-muestra").addEventListener("input", () => { d.muestra = Number(qs("#q-muestra").value)||0; updateSheet(); });
  qs("#q-molde").addEventListener("input", () => { d.molde = Number(qs("#q-molde").value)||0; updateSheet(); });
  qs("#q-termsProd").addEventListener("input", () => { d.termsProd = qs("#q-termsProd").value; updateSheet(); });
  qs("#q-termsMuestra").addEventListener("input", () => { d.termsMuestra = qs("#q-termsMuestra").value; updateSheet(); });

  qs("#q-dropzone").onclick = () => qs("#q-imgInput").click();
  qs("#q-imgInput").onchange = (e) => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => { d.img = r.result; qs("#q-imgPreview").src = d.img; qs("#q-imgPreview").style.display="block"; qs("#q-imgPh").style.display="none"; updateSheet(); };
    r.readAsDataURL(f);
  };

  qs("#q-addCurva").onclick = () => { d.curva.push({talla:"Nueva",consumo:1,cant:1}); renderCurva(); updateSheet(); };
  qs("#q-addColor").onclick = () => { d.colores.push({color:"Nuevo",cant:1}); renderColores(); updateSheet(); };

  qs("#q-cancel").onclick = () => { state.cotiz.modo = "lista"; render(); };
  qs("#q-save").onclick = () => {
    if(!d.cliente.trim() || !d.prenda.trim()){ toast("Completá al menos la clienta y la prenda."); return; }
    const idx = cotizaciones.findIndex(x => x.id === d.id);
    if(idx >= 0) cotizaciones[idx] = d; else cotizaciones.push(d);
    toast(d.id+" guardada");
    abrirCotiz("ver", d.id);
  };
  page.querySelector('[data-back="cotizaciones"]').onclick = () => { state.cotiz.modo = "lista"; render(); };

  renderCurva(); renderColores(); renderGroups(); updateSheet();
}

/* ---- exportar / imprimir (con aviso si corre en iframe con sandbox) ---- */
function inIframe(){ try{ return window.self !== window.top; }catch(e){ return true; } }
function wireExport(sheetEl, q, btnSel){
  const btn = page.querySelector(btnSel); if(!btn) return;
  const notice = $("#exportNotice");
  const close = $("#exportNoticeClose"); if(close) close.onclick = () => notice.classList.remove("is-open");
  btn.onclick = () => {
    const base = document.title;
    document.title = "Cotizacion-"+q.id.replace(/[^a-zA-Z0-9]/g,"")+"-"+q.cliente.replace(/[^a-zA-Z0-9]+/g,"-");
    if(inIframe()){
      if(notice) notice.classList.add("is-open");
      document.title = base;
    } else {
      window.print();
    }
  };
  window.addEventListener("afterprint", () => { document.title = base_title_fallback(); });
}
function base_title_fallback(){ return "Santa Isabel — Taller"; }

/* ============ interacciones ============ */
function wire(){
  page.querySelectorAll("[data-open]").forEach(el => el.onclick = () => abrirPedido(el.dataset.open));
  page.querySelectorAll("[data-openq]").forEach(el => el.onclick = () => abrirCotiz("ver", el.dataset.openq));
  page.querySelectorAll("[data-day]").forEach(el => { if(el.dataset.open) return; el.onclick = () => abrirDia(el.dataset.day); });
  page.querySelectorAll("[data-goto]").forEach(el => el.onclick = () => go(el.dataset.goto));
  page.querySelectorAll("[data-mes]").forEach(el => el.onclick = () => {
    const n = Number(el.dataset.mes);
    state.mes = n === 0 ? new Date(hoy().getFullYear(), hoy().getMonth(), 1) : new Date(state.mes.getFullYear(), state.mes.getMonth()+n, 1);
    render();
  });
  page.querySelectorAll("[data-estado]").forEach(el => el.onclick = () => { state.filtros.estado = el.dataset.estado; render(); });
  const q = page.querySelector("#q");
  if(q) q.oninput = debounce(() => { state.filtros.texto = q.value; const pos = q.selectionStart; render();
    const nq = page.querySelector("#q"); if(nq){ nq.focus(); nq.setSelectionRange(pos,pos); } }, 220);
  const fc = page.querySelector("#fc"); if(fc) fc.onchange = () => { state.filtros.cliente = fc.value; render(); };
  const fr = page.querySelector("#fr"); if(fr) fr.onchange = () => { state.filtros.rango = fr.value; render(); };
  const nq2 = page.querySelector("#btnNewQuoteInline"); if(nq2) nq2.onclick = () => abrirCotiz("nueva");
}
function debounce(fn,ms){ let t; return function(){ clearTimeout(t); t = setTimeout(fn,ms); }; }

/* ---- drawer ---- */
const scrim = $("#scrim"), drawer = $("#drawer"), modal = $("#modal");
function abrirDrawer(){ scrim.dataset.open = "true"; drawer.dataset.open = "true"; drawer.focus(); }
function cerrarDrawer(){ drawer.dataset.open = "false"; if(modal.dataset.open !== "true") scrim.dataset.open = "false"; state.pedidoAbierto = null; }
$("#drawerClose").onclick = cerrarDrawer;
scrim.onclick = () => { cerrarDrawer(); cerrarModal(); };
document.addEventListener("keydown", e => { if(e.key === "Escape"){ cerrarDrawer(); cerrarModal(); } });

function abrirPedido(id){
  const p = pedidos.find(x => x.id === id);
  if(!p) return;
  state.pedidoAbierto = id;
  const c = cargaDe(p.compromiso);
  const idx = ESTADOS.indexOf(p.estado);
  const sig = idx >= 0 && idx < ESTADOS.length-1 ? ESTADOS[idx+1] : null;

  $("#drawerKicker").textContent = p.id;
  $("#drawerTitle").textContent = p.cliente;
  $("#drawerBody").innerHTML =
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+badge(p)+
      '<span class="prio'+(p.prioridad==="Alta"?" prio--alta":"")+'">Prioridad '+p.prioridad+"</span></div>"+
    (atrasado(p) ? '<div class="notice notice--alta"><h3>Pedido atrasado</h3>La fecha comprometida venció '+relativo(p.compromiso)+" y el pedido sigue en <b>"+p.estado+"</b>.</div>" : "")+
    "<dl class=\"dl\">"+
      "<dt>Prenda</dt><dd>"+esc(p.producto)+"</dd>"+
      '<dt>Cantidad</dt><dd class="num">'+nf(p.cantidad)+" unidades</dd>"+
      "<dt>Registrado</dt><dd>"+fechaLarga(p.registro)+"</dd>"+
      "<dt>Solicitada</dt><dd>"+fechaLarga(p.solicitada)+"</dd>"+
      "<dt>Comprometida</dt><dd>"+fechaLarga(p.compromiso)+' <span class="muted">('+relativo(p.compromiso)+")</span></dd>"+
      "<dt>Carga del día</dt><dd>"+NIVEL_TXT[c.nivel]+' <span class="muted">· '+c.n+" pedido"+(c.n===1?"":"s")+"</span></dd>"+
      "<dt>Responsable</dt><dd>"+(esc(p.responsable) || '<span class="muted">Sin asignar</span>')+"</dd>"+
      "<dt>Observaciones</dt><dd>"+(esc(p.obs) || '<span class="muted">—</span>')+"</dd>"+
    "</dl>"+
    "<div>"+
      '<div class="eyebrow" style="margin-bottom:12px">Recorrido del pedido</div>'+
      '<div class="stepper'+(atrasado(p) ? " stepper--late" : "")+'">'+
        ESTADOS.map((e,i) => '<div class="step'+(i < idx ? " is-done" : i === idx ? " is-now" : "")+'"><span class="step__dot"></span><span class="step__lab">'+(e === "En producción" ? "Producción" : e)+"</span></div>").join("")+
      "</div>"+
      '<div class="eyebrow" style="margin-bottom:8px">Cambiar estado</div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
        (sig ? '<button class="btn btn--primary btn--sm" data-set="'+sig+'">Pasar a '+sig+"</button>" : '<span class="muted" style="font-size:13px">Pedido entregado. Flujo completo.</span>')+
        '<select class="input" id="estSel" style="width:auto">'+ESTADOS.map(e => '<option'+(e===p.estado?" selected":"")+">"+e+"</option>").join("")+"</select>"+
      "</div>"+
    "</div>"+
    "<div>"+
      '<div class="eyebrow" style="margin-bottom:10px">Historial</div>'+
      '<ul class="hist">'+p.hist.map(h => "<li>"+esc(h.texto)+"<time>"+fechaLarga(h.fecha)+(h.hora ? " · "+h.hora.toLocaleTimeString("es-BO",{hour:"2-digit",minute:"2-digit"}) : "")+"</time></li>").join("")+"</ul>"+
    "</div>";

  const b = $("#drawerBody").querySelector("[data-set]"); if(b) b.onclick = () => cambiarEstado(p, b.dataset.set);
  const sel = $("#estSel"); if(sel) sel.onchange = () => cambiarEstado(p, sel.value);
  abrirDrawer();
}
function cambiarEstado(p, nuevo){
  if(p.estado === nuevo) return;
  p.estado = nuevo;
  p.hist.push({ fecha:iso(hoy()), texto:"Estado → "+nuevo, hora:new Date() });
  toast(p.id+" · "+p.cliente+" ahora está en "+nuevo);
  render(); abrirPedido(p.id);
}

function abrirDia(f){
  const ps = pedidosDe(f).sort((a,b) => a.cliente.localeCompare(b.cliente));
  const c = cargaDe(f);
  const unid = ps.reduce((s,p) => s+p.cantidad,0);
  $("#drawerKicker").textContent = "Día de entrega";
  $("#drawerTitle").textContent = fechaLarga(f).replace(/^./, s => s.toUpperCase());
  $("#drawerBody").innerHTML =
    '<div class="notice notice--'+(c.nivel==="cero"?"baja":c.nivel)+'"><h3>'+NIVEL_TXT[c.nivel]+"</h3>"+
      c.n+" pedido"+(c.n===1?"":"s")+" comprometido"+(c.n===1?"":"s")+(unid ? ' · <span class="num">'+nf(unid)+"</span> unidades" : "")+"</div>"+
    (ps.length ? '<div class="rows" style="border:1px solid var(--line);border-radius:var(--r)">'+ps.map(fila).join("")+"</div>"
               : '<div class="empty">No hay pedidos comprometidos para esta fecha.</div>')+
    '<button class="btn btn--primary" id="newHere">+ Crear pedido para esta fecha</button>';
  $("#drawerBody").querySelectorAll("[data-open]").forEach(el => el.onclick = () => abrirPedido(el.dataset.open));
  $("#newHere").onclick = () => { cerrarDrawer(); abrirModal(f); };
  abrirDrawer();
}

/* ---- modal nuevo pedido ---- */
const form = $("#form");
function abrirModal(fecha){
  form.reset();
  $("#f-cantidad").value = 1;
  $("#f-compromiso").value = fecha || isoOff(30);
  $("#f-solicitada").value = fecha || isoOff(30);
  state.confirmAlta = false;
  chequearCarga();
  scrim.dataset.open = "true"; modal.dataset.open = "true";
  setTimeout(() => $("#f-cliente").focus(), 60);
}
function cerrarModal(){ modal.dataset.open = "false"; if(drawer.dataset.open !== "true") scrim.dataset.open = "false"; }
$("#btnNew").onclick = () => abrirModal();
$("#btnNewQuote").onclick = () => abrirCotiz("nueva");
$("#fab").onclick = () => abrirModal();
$("#modalClose").onclick = cerrarModal;
$("#btnCancel").onclick = cerrarModal;

function chequearCarga(){
  const f = $("#f-compromiso").value;
  const box = $("#loadCheck"), btn = $("#btnSave");
  if(!f){ box.innerHTML = ""; btn.textContent = "Registrar pedido"; return; }
  const c = cargaDe(f), ps = pedidosDe(f);
  const nivel = c.nivel === "cero" ? "baja" : c.nivel;
  const detalle = ps.slice(0,5).map(p => "<li>"+esc(p.cliente)+" · "+esc(p.producto)+" · "+nf(p.cantidad)+" und</li>").join("");
  box.innerHTML = '<div class="notice notice--'+nivel+'">'+
    "<h3>"+(c.nivel === "alta" ? "Esta fecha ya tiene carga alta" : NIVEL_TXT[c.nivel]+" para el "+fechaCorta(f))+"</h3>"+
    "Pedidos existentes para el "+fechaLarga(f)+": <b>"+c.n+"</b>"+
    (ps.length ? "<ul>"+detalle+(ps.length>5 ? "<li>+"+(ps.length-5)+" más</li>" : "")+"</ul>" : "")+
    (c.nivel === "alta" ? "<div style=\"margin-top:7px\"><b>¿Deseás continuar con esta fecha?</b> Comprometer un pedido más puede poner en riesgo las entregas del día.</div>" : "")+
  "</div>";
  if(c.nivel === "alta" && !state.confirmAlta){ btn.textContent = "Registrar de todos modos"; btn.classList.add("btn--danger"); btn.classList.remove("btn--primary"); }
  else { btn.textContent = "Registrar pedido"; btn.classList.add("btn--primary"); btn.classList.remove("btn--danger"); }
}
$("#f-compromiso").addEventListener("change", () => { state.confirmAlta = false; chequearCarga(); });
$("#f-compromiso").addEventListener("input", () => { state.confirmAlta = false; chequearCarga(); });

form.addEventListener("submit", e => {
  e.preventDefault();
  const cliente = $("#f-cliente").value.trim();
  const producto = $("#f-producto").value.trim();
  const cantidad = Number($("#f-cantidad").value);
  const compromiso = $("#f-compromiso").value;
  if(!cliente || !producto || !cantidad || !compromiso){ toast("Completá clienta, prenda, cantidad y fecha comprometida."); return; }
  const p = crear({
    cliente, producto, cantidad, compromiso, solicitada:$("#f-solicitada").value || compromiso, registro:iso(hoy()),
    estado:"Nuevo", prioridad:$("#f-prioridad").value, responsable:$("#f-responsable").value.trim(), obs:$("#f-obs").value.trim()
  });
  pedidos.push(p);
  cerrarModal();
  state.mes = new Date(parse(compromiso).getFullYear(), parse(compromiso).getMonth(), 1);
  state.filtros = { estado:"Todos", cliente:"Todos", rango:"Todas", texto:"" };
  state.recien = p.id;
  go("pedidos");
  const filaEl = page.querySelector('[data-open="'+p.id+'"]');
  if(filaEl) filaEl.scrollIntoView({ behavior:"smooth", block:"center" });
  toast(p.id+" registrado · entrega "+fechaLarga(compromiso));
  abrirPedido(p.id);
});

/* ---- toast ---- */
let tt;
function toast(msg){ const el = $("#toast"); el.textContent = msg; el.dataset.open = "true"; clearTimeout(tt); tt = setTimeout(() => el.dataset.open = "false", 3200); }

/* ---- datalists ---- */
$("#clientes").innerHTML = [...new Set(pedidos.map(p => p.cliente))].sort().map(c => '<option value="'+esc(c)+'">').join("");
$("#productos").innerHTML = PRODUCTOS.map(c => '<option value="'+esc(c)+'">').join("");
$("#responsables").innerHTML = RESPONSABLES.map(c => '<option value="'+esc(c)+'">').join("");

render();
})();
</script>
</body>
</html>
